<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070509">
<title>Оракул банды Недбай</title>
<style>
:root{--gold:#d6ae55;--gold2:#f1d788;--cream:#f5e8cb;--muted:#b7a791}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#070509;color:var(--cream);font-family:Arial,Helvetica,sans-serif}
.app{width:min(520px,100%);margin:auto;min-height:100vh;background:#070509}
.picture-screen{display:none;min-height:100vh;position:relative;background:#070509}
.picture-screen.active{display:block}
.screen-img{display:block;width:100%;height:auto;min-height:100vh;object-fit:cover;object-position:center top}
.hotspot{position:absolute;border:0;background:transparent;color:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hotspot:focus-visible{outline:2px solid var(--gold2);border-radius:999px}
#homeBtn{left:15%;width:70%;top:88.5%;height:7.5%}
#readyBtn{left:28%;width:44%;top:89.2%;height:6.5%}
#drawBtn{left:20%;width:60%;top:77.0%;height:8.0%}

#resultScreen{
 display:none;min-height:100vh;padding:34px 18px 28px;text-align:center;
 background:
 radial-gradient(circle at 50% 8%,rgba(78,20,58,.42),transparent 28%),
 radial-gradient(circle at 15% 28%,rgba(87,23,53,.22),transparent 22%),
 linear-gradient(180deg,#120a11,#070509 72%);
 position:relative;overflow:hidden
}
#resultScreen:before{
 content:"";position:absolute;inset:0;pointer-events:none;opacity:.42;
 background-image:radial-gradient(circle,#e1b85e 0 1px,transparent 1.4px);
 background-size:89px 89px
}
#resultScreen.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
.kicker{position:relative;z-index:1;color:var(--gold2);font-size:11px;letter-spacing:.25em;text-transform:uppercase;font-weight:700}
.card{
 position:relative;z-index:1;width:min(365px,94vw);margin:16px auto 18px;padding:9px;
 border:1px solid var(--gold);border-radius:20px;
 background:linear-gradient(160deg,#351126,#120911);box-shadow:0 24px 70px #000c
}
.card-inner{
 min-height:540px;border:1px solid #7b5a31;border-radius:13px;padding:22px 18px;
 display:flex;flex-direction:column;justify-content:space-between;overflow:hidden
}
.cat{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#aa9275}
.title{
 font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,10vw,50px);line-height:1;
 color:var(--gold2);text-transform:uppercase;overflow-wrap:anywhere;margin-top:8px
}
.art{
 height:230px;margin:10px 0 12px;border:1px solid #6d4a2e;border-radius:8px;position:relative;overflow:hidden;
 background:
 radial-gradient(circle at 77% 23%,#e2b35f 0 17px,transparent 18px),
 radial-gradient(circle at 50% 58%,#55204a,#1a0d1a 68%);
}
.art:before{content:"✦";position:absolute;left:22px;top:18px;color:#e3ba60;font-size:22px}
.art:after{content:"✈";position:absolute;right:22px;bottom:18px;color:#e3ba60;font-size:34px;transform:rotate(-18deg)}
.symbol{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:116px;filter:drop-shadow(0 0 14px #d49b6f)}
.text{font:21px/1.28 Georgia,"Times New Roman",serif;color:#f4e7ce}
.nam{font-weight:900;letter-spacing:.11em;color:var(--gold2);font-size:19px;margin-top:12px}
.after{position:relative;z-index:1;font:700 19px/1.25 Georgia;color:var(--cream);margin:3px 0 8px}
.cta{position:relative;z-index:1;color:#c7b69f;font-size:13px;line-height:1.55;max-width:360px;margin-bottom:14px}
.cta b{color:var(--gold2)}
.share{
 position:relative;z-index:1;border:1px solid var(--gold);border-radius:999px;padding:16px 25px;
 background:linear-gradient(135deg,#f2d98b,#d3a447);color:#130c09;font-weight:900;
 letter-spacing:.11em;font-size:12px;text-transform:uppercase;cursor:pointer
}
.small{position:relative;z-index:1;font-size:10px;color:#8d7e72;margin-top:13px}
</style>
</head>
<body>
<main class="app">
  <section id="home" class="picture-screen active">
    <img class="screen-img" src="assets/screen1.jpg" alt="Оракул банды Недбай">
    <button id="homeBtn" class="hotspot" aria-label="Войти в оракул">Войти в оракул</button>
  </section>

  <section id="warn" class="picture-screen">
    <img class="screen-img" src="assets/screen2.jpg" alt="Предупреждение оракула">
    <button id="readyBtn" class="hotspot" aria-label="Я готова">Я готова</button>
  </section>

  <section id="draw" class="picture-screen">
    <img class="screen-img" src="assets/screen3.jpg" alt="Выбери миг">
    <button id="drawBtn" class="hotspot" aria-label="Вытянуть карту">Вытянуть карту</button>
  </section>

  <section id="resultScreen">
    <div class="kicker">ТЕБЕ ВЫПАЛО</div>
    <div id="resultCard"></div>
    <div class="after">Ну всё. Теперь живи с этим. 😏</div>
    <div class="cta">Покажи, что сегодня выпало именно тебе.<br><b>Выложи в сторис и отметь @tatakomotako ✈️</b></div>
    <button id="shareBtn" class="share">ПОДЕЛИТЬСЯ КАРТОЙ</button>
    <div class="small">Одна карта в день. Следующая — завтра.</div>
  </section>
</main>

<script>
const cards=[{"id":1,"title":"БОГАТЫЙ ТУРИСТ","text":"В этом году тебе встретится человек, который не спросит: «А можно дешевле?» Он спросит: «А что есть лучше?» Не пугайся. Это твоя большая комиссия.","category":"ДЕНЬГИ"},{"id":2,"title":"ЖИРНАЯ БРОНЬ","text":"Одна бронь принесёт тебе столько комиссии, что ты трижды откроешь банковское приложение просто посмотреть.","category":"ДЕНЬГИ"},{"id":3,"title":"БОЛЬШОЙ ЧЕК","text":"Ты назовёшь цену и приготовишься объяснять. В ответ услышишь: «Хорошо. Бронируем».","category":"ДЕНЬГИ"},{"id":4,"title":"ДЕНЕЖНЫЙ ПОНЕДЕЛЬНИК","text":"Один понедельник начнётся не с кофе, а с оплаты. Их будет несколько.","category":"ДЕНЬГИ"},{"id":5,"title":"ТРИ БРОНИ","text":"Три оплаты подряд. Без торга. Без «мы подумаем». Без нервного тика.","category":"ДЕНЬГИ"},{"id":6,"title":"ВЫСОКАЯ КОМИССИЯ","text":"Вселенная наконец-то решила компенсировать все твои бесплатные консультации.","category":"ДЕНЬГИ"},{"id":7,"title":"VIP","text":"В твоей жизни появится турист, которому не нужно дешевле. Ему нужно лучше.","category":"ДЕНЬГИ"},{"id":8,"title":"ЛЮКС","text":"Скоро слово «люкс» перестанет быть описанием чужого отдыха.","category":"ДЕНЬГИ"},{"id":9,"title":"БИЗНЕС-КЛАСС","text":"Однажды клиент скажет: «Эконом не рассматриваем». Постарайся не выдать себя лицом.","category":"ДЕНЬГИ"},{"id":10,"title":"НОВЫЙ РЕКОРД","text":"Ты побьёшь собственный рекорд продаж. И сначала не поверишь цифре.","category":"ДЕНЬГИ"},{"id":11,"title":"ВЕЛИКОЕ «ДА»","text":"После отправленной подборки тебе ответят: «Берём». И больше ничего не спросят.","category":"ПРОДАЖИ"},{"id":12,"title":"С ПЕРВОГО РАЗА","text":"Первый предложенный отель понравится всем. Даже свекрови.","category":"ПРОДАЖИ"},{"id":13,"title":"ЗАКРЫТАЯ СДЕЛКА","text":"Ты почувствуешь то самое приятное: «Вот. Я сделала это».","category":"ПРОДАЖИ"},{"id":14,"title":"САРАФАН","text":"Один довольный турист приведёт второго. Второй — третьего.","category":"ПРОДАЖИ"},{"id":15,"title":"СЛУЧАЙНЫЙ ЛИД","text":"Сообщение от незнакомого человека станет одной из лучших продаж года.","category":"ПРОДАЖИ"},{"id":16,"title":"РЕКОМЕНДАЦИЯ","text":"Тебя порекомендуют словами: «Она дороже, но иди только к ней».","category":"ПРОДАЖИ"},{"id":17,"title":"ПОВТОРНИК","text":"Старый турист вернётся. Бюджет у него будет уже совсем другой.","category":"ПРОДАЖИ"},{"id":18,"title":"ЛЁГКАЯ ПРОДАЖА","text":"Одна бронь окажется подозрительно простой. Не ищи подвох.","category":"ПРОДАЖИ"},{"id":19,"title":"ТВОЙ ЧАС","text":"Будет месяц, когда ты посмотришь на продажи и скажешь: «Нихуя себе».","category":"ПРОДАЖИ"},{"id":20,"title":"СВОЙ СТИЛЬ","text":"Ты перестанешь пытаться продавать «как надо» и начнёшь продавать так, как умеешь именно ты.","category":"ПРОДАЖИ"},{"id":21,"title":"МНЕ ТОЛЬКО СПРОСИТЬ","text":"Он пришёл просто узнать цены. Через час внесёт предоплату.","category":"ТУРИСТЫ"},{"id":22,"title":"БЛУДНЫЙ ТУРИСТ","text":"Тот, кто ушёл «ещё посмотреть», вернётся. Начнёт с: «Вы нас помните?»","category":"ТУРИСТЫ"},{"id":23,"title":"ТУРИСТ БЕЗ СКИДКИ","text":"Ты встретишь человека, который не попросит скидку. Запомни этот день.","category":"ТУРИСТЫ"},{"id":24,"title":"МОЛЧАЛИВЫЙ","text":"Он исчезнет после твоей подборки на 47 отелей. Через три месяца вернётся с паспортами.","category":"ТУРИСТЫ"},{"id":25,"title":"БОГАТЫЙ","text":"Он не спросит цену. Он спросит, что есть лучше.","category":"ТУРИСТЫ"},{"id":26,"title":"СЕМЬЯ ИЗ ВОСЬМИ","text":"У всех будут разные пожелания. Бюджет будет один. Ты справишься.","category":"ТУРИСТЫ"},{"id":27,"title":"МУЖ ПРОТИВ","text":"Отель выбрала жена. Дети согласны. Осталось победить финального босса.","category":"ТУРИСТЫ"},{"id":28,"title":"ПОДРУГА СКАЗАЛА","text":"В твою подборку вмешается человек, который знает о туризме всё. Потому что один раз был в Турции.","category":"ТУРИСТЫ"},{"id":29,"title":"ТИКТОК СКАЗАЛ","text":"Турист найдёт «секретный пляж без людей». Ты будешь объяснять, почему там 600 человек.","category":"ТУРИСТЫ"},{"id":30,"title":"А МЫ ПОДУМАЕМ","text":"На этот раз они действительно подумают. И вернутся.","category":"ТУРИСТЫ"},{"id":31,"title":"48-Й ОТЕЛЬ","text":"Ты покажешь 47 вариантов. Он выберет первый.","category":"БОЛЬ"},{"id":32,"title":"СВЯЩЕННЫЙ СКРИНШОТ","text":"Тебе пришлют цену дешевле. Другие даты. Другой отель. Другой город вылета. Но дешевле же.","category":"БОЛЬ"},{"id":33,"title":"ВЫЛЕТ ЗАВТРА","text":"«Нас пятеро. Хотим завтра. Недорого». Ты уже проходила страшнее.","category":"БОЛЬ"},{"id":34,"title":"ФИНАЛЬНАЯ ПОДБОРКА","text":"Ты напишешь «финальные варианты». Это будет ложь.","category":"БОЛЬ"},{"id":35,"title":"А НА БУКИНГЕ?","text":"Тебя ждёт разговор, который пережил уже несколько поколений турагентов.","category":"БОЛЬ"},{"id":36,"title":"А МОЖНО ДЕШЕВЛЕ?","text":"Можно. Но тогда это будет не тот отель, не те даты и не тот отпуск.","category":"БОЛЬ"},{"id":37,"title":"ОТЗЫВ 2014 ГОДА","text":"Турист найдёт единственный плохой отзыв об идеальном отеле. И сочтёт его самым достоверным.","category":"БОЛЬ"},{"id":38,"title":"ПАСПОРТ","text":"Ты попросишь паспорт. Турист пришлёт фотографию своей собаки.","category":"БОЛЬ"},{"id":39,"title":"ЗАГРАНПАСПОРТ","text":"Идеальный тур найден. И только сейчас выясняется, что паспорт заканчивается через месяц.","category":"БОЛЬ"},{"id":40,"title":"КОНДИЦИОНЕР","text":"Тебя спросят, какая температура будет в номере. Ты турагент, но теперь ещё и синоптик.","category":"БОЛЬ"},{"id":41,"title":"НОВАЯ СТРАНА","text":"На твоей карте мира появится новая страна. И на этот раз не только в презентации.","category":"ПУТЕШЕСТВИЯ"},{"id":42,"title":"МОРЕ","text":"Тебя ждёт море, солнце и несколько часов без сообщений «а где трансфер?».","category":"ПУТЕШЕСТВИЯ"},{"id":43,"title":"БИЛЕТ КУПЛЕН","text":"В какой-то момент билет уже будет куплен. И ты поймёшь: «Я реально лечу».","category":"ПУТЕШЕСТВИЯ"},{"id":44,"title":"ВНЕЗАПНЫЙ ОТПУСК","text":"Лучшая поездка года окажется той, которую ты почти не планировала.","category":"ПУТЕШЕСТВИЯ"},{"id":45,"title":"ПЕРВАЯ ЛИНИЯ","text":"Хватит говорить «мне всё равно, я только ночевать». Тебе не всё равно.","category":"ПУТЕШЕСТВИЯ"},{"id":46,"title":"МАЛЬДИВСКИЙ ЗНАК","text":"Ты слишком долго продаёшь рай другим. Пора проверить его лично.","category":"ПУТЕШЕСТВИЯ"},{"id":47,"title":"ЛУЧШИЙ ЗАКАТ","text":"Ты увидишь закат, который камера всё равно не передаст.","category":"ПУТЕШЕСТВИЯ"},{"id":48,"title":"НОВЫЕ ЛЮДИ","text":"Одна поездка познакомит тебя с человеком, который ещё сыграет роль в твоей жизни.","category":"ПУТЕШЕСТВИЯ"},{"id":49,"title":"АПГРЕЙД","text":"Твоя поездка окажется лучше, чем ты планировала.","category":"ПУТЕШЕСТВИЯ"},{"id":50,"title":"ОТПУСК","text":"Ты наконец-то поедешь отдыхать и не будешь открывать Booking каждые десять минут.","category":"ПУТЕШЕСТВИЯ"},{"id":51,"title":"НОВЫЙ УРОВЕНЬ","text":"То, что год назад казалось большой целью, станет обычным рабочим результатом.","category":"КАРЬЕРА"},{"id":52,"title":"УВЕРЕННОСТЬ","text":"Ты научишься говорить о своей цене без желания оправдаться.","category":"КАРЬЕРА"},{"id":53,"title":"СВОЯ АУДИТОРИЯ","text":"К тебе начнут приходить именно «твои» туристы.","category":"КАРЬЕРА"},{"id":54,"title":"ЭКСПЕРТ","text":"Ты поймёшь: тебе уже не нужно доказывать, что ты знаешь, что делаешь.","category":"КАРЬЕРА"},{"id":55,"title":"СМЕЛОСТЬ","text":"Ты откажешь клиенту, которого раньше боялась бы потерять.","category":"КАРЬЕРА"},{"id":56,"title":"РОСТ","text":"В этом году ты вырастешь сильнее, чем планировала.","category":"КАРЬЕРА"},{"id":57,"title":"НОВЫЙ ФОРМАТ","text":"Тебя ждёт идея, которая изменит твоё отношение к работе.","category":"КАРЬЕРА"},{"id":58,"title":"ИМЯ","text":"О твоей работе начнут говорить до того, как человек попадёт к тебе.","category":"КАРЬЕРА"},{"id":59,"title":"ЛИЧНЫЙ БРЕНД","text":"Одна твоя публикация приведёт больше клиентов, чем десять рекламных объявлений.","category":"КАРЬЕРА"},{"id":60,"title":"ЗВЕЗДА","text":"Ты станешь заметнее. И тебе это понравится.","category":"КАРЬЕРА"},{"id":61,"title":"СЛУЧАЙНОСТЬ","text":"Случайное сообщение окажется совсем не случайным.","category":"МАГИЯ"},{"id":62,"title":"ЗНАК","text":"В ближайшее время ты увидишь знак. Не игнорируй его.","category":"МАГИЯ"},{"id":63,"title":"ВОВРЕМЯ","text":"Ты окажешься в нужном месте в нужный момент.","category":"МАГИЯ"},{"id":64,"title":"ШАНС","text":"Тебе предложат то, чего ты не планировала. Соглашайся раньше, чем включится «а вдруг».","category":"МАГИЯ"},{"id":65,"title":"ВОЗВРАЩЕНИЕ","text":"То, что казалось закрытой историей, ещё даст о себе знать.","category":"МАГИЯ"},{"id":66,"title":"СЧАСТЛИВЫЙ ДЕНЬ","text":"Один день принесёт сразу несколько хороших новостей.","category":"МАГИЯ"},{"id":67,"title":"НЕОЖИДАННЫЕ ДЕНЬГИ","text":"Деньги придут оттуда, откуда ты их уже не ждала.","category":"МАГИЯ"},{"id":68,"title":"СОВПАДЕНИЕ","text":"Два события сложатся настолько идеально, что ты заподозришь магию.","category":"МАГИЯ"},{"id":69,"title":"ПОВОРОТ","text":"Небольшое изменение планов приведёт к гораздо лучшему результату.","category":"МАГИЯ"},{"id":70,"title":"ВСЁ СХОДИТСЯ","text":"То, что сейчас кажется набором случайностей, скоро сложится в картину.","category":"МАГИЯ"},{"id":71,"title":"ПАЛЬМЫ","text":"В твоей жизни станет больше пальм. Это хороший знак.","category":"РАЙ"},{"id":72,"title":"ПЛЯЖ","text":"Ты окажешься на пляже, который захочется никому не показывать.","category":"РАЙ"},{"id":73,"title":"КОКТЕЙЛЬ","text":"Один вечер будет настолько хорош, что телефон останется в сумке.","category":"РАЙ"},{"id":74,"title":"БЕЛЫЙ ПЕСОК","text":"Ты увидишь место, ради которого поймёшь, зачем вообще работаешь.","category":"РАЙ"},{"id":75,"title":"ЗАВТРАК С ВИДОМ","text":"Твой следующий красивый завтрак будет не на картинке из Pinterest.","category":"РАЙ"},{"id":76,"title":"СОЛНЦЕ","text":"После сложного периода наконец станет легче.","category":"РАЙ"},{"id":77,"title":"ТЁПЛЫЙ ВЕТЕР","text":"Ты получишь именно тот отдых, которого давно не хватало.","category":"РАЙ"},{"id": Я"},{"id":93,"title":"ИМПЕРАТОР КОМИССИИ","text":"Твой доход перестанет зависеть от случайности. Ты сама начнёшь создавать большие продажи.","category":"ЛЕГЕНДАРНАЯ"},{"id":94,"title":"КОЛЕСО БРОНИРОВАНИЯ","text":"Всё закрутится. Заявки, оплаты, рекомендации. Главное — не забывай пить воду.","category":"ЛЕГЕНДАРНАЯ"},{"id":95,"title":"МАГ","text":"Ты уже знаешь больше, чем думаешь. Доверяй своим решениям.","category":"ЛЕГЕНДАРНАЯ"},{"id":96,"title":"ЗВЕЗДА","text":"Твой самый сильный год ещё впереди.","category":"ЛЕГЕНДАРНАЯ"},{"id":97,"title":"МИР","text":"Один важный цикл закончится. И начнётся новый.","category":"ЛЕГЕНДАРНАЯ"},{"id":98,"title":"СОЛНЦЕ","text":"Будет момент, когда ты оглянешься назад и скажешь: «Вот ради этого всё и было».","category":"ЛЕГЕНДАРНАЯ"},{"id":99,"title":"ФОРТУНА","text":"Тебе выпадет шанс, который нельзя будет просчитать заранее. Просто окажись готова его взять.","category":"ЛЕГЕНДАРНАЯ"},{"id":100,"title":"ТВОЙ ГОД","text":"Следующий День туризма ты встретишь в точке, о которой сейчас можешь только мечтать.","category":"ЛЕГЕНДАРНАЯ"},{"id":101,"title":"БЕЛАЯ ПОЛОСА","text":"Всё начнёт складываться подозрительно хорошо. Не пугайся. Это не подвох.","category":"СУПЕРКАРТА"},{"id":102,"title":"БОЛЬШАЯ МЕЧТА","text":"То, что сейчас кажется слишком большим, станет твоей новой нормой.","category":"СУПЕРКАРТА"},{"id":103,"title":"ДЕНЬГИ ЛЮБЯТ ТЕБЯ","text":"В ближайшие 12 месяцев твои банковские уведомления станут приятнее.","category":"СУПЕРКАРТА"},{"id":104,"title":"НЕБО НЕ ПРЕДЕЛ","text":"Ты сама ещё не знаешь, насколько далеко можешь зайти.","category":"СУПЕРКАРТА"},{"id":105,"title":"СВОБОДА","text":"Ты научишься работать так, чтобы работа больше не управляла всей твоей жизнью.","category":"СУПЕРКАРТА"},{"id":106,"title":"СВОИ ЛЮДИ","text":"Рядом станет больше людей, с которыми можно не только работать, но и смеяться до слёз.","category":"СУПЕРКАРТА"},{"id":107,"title":"СПАСИБО","text":"Ты получишь сообщение от туриста, которое напомнит, let current=null;
const DAY_KEY='nedbay_oracle_day_exactpics_v1';
const CARD_KEY='nedbay_oracle_card_exactpics_v1';

function todayKey(){
 const d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function savedCard(){
 try{
   if(localStorage.getItem(DAY_KEY)===todayKey()){
     const id=Number(localStorage.getItem(CARD_KEY));
     return cards.find(c=>c.id===id)||null;
   }
 }catch(e){}
 return null;
}
function saveCard(c){
 try{
   localStorage.setItem(DAY_KEY,todayKey());
   localStorage.setItem(CARD_KEY,String(c.id));
 }catch(e){}
}
function show(id){
 document.querySelectorAll('.picture-screen,#resultScreen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 window.scrollTo(0,0);
}
function symbolFor(c){
 const s=(c.title+' '+c.text).toLowerCase();
 if(s.includes('медуз'))return '🪼';
 if(s.includes('самол')||s.includes('рейс')||s.includes('вылет'))return '✈️';
 if(s.includes('море')||s.includes('океан')||s.includes('пляж'))return '🌊';
 if(s.includes('отел'))return '🏨';
 if(s.includes('чемод'))return '🧳';
 if(s.includes('деньг')||s.includes('комисс')||s.includes('чек'))return '💰';
 if(s.includes('паспорт')||s.includes('виза'))return '🛂';
 if(s.includes('мальдив'))return '🏝️';
 if(s.includes('кофе'))return '☕';
 return ['✈️','🧭','🌙','🌴','🧳','🌍'][c.id%6];
}
function esc(s){
 return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function render(){
 document.getElementById('resultCard').innerHTML=`
 <div class="card"><div class="card-inner">
   <div><div class="cat">${esc(current.category)}</div><div class="title">${esc(current.title)}</div></div>
   <div class="art"><div class="symbol">${symbolFor(current)}</div></div>
   <div class="text">${esc(current.text)}</div>
   <div class="nam">НАМ МОЖНО</div>
 </div></div>`;
 show('resultScreen');
}
function proceedToDraw(){
 const saved=savedCard();
 if(saved){current=saved;render()} else show('draw');
}
function drawCard(){
 const saved=savedCard();
 if(saved){current=saved;render();return}
 current=cards[Math.floor(Math.random()*cards.length)];
 saveCard(current);
 render();
}
async function shareCard(){
 const text=`🔮 Оракул банды Недбай

Мне сегодня выпала карта «${current.title}».

${current.text}

НАМ МОЖНО ✈️

С днём туризма от @tatakomotako`;
 if(navigator.share){
   try{await navigator.share({title:'Оракул банды Недбай',text});return}catch(e){}
 }
 try{
   await navigator.clipboard.writeText(text);
   alert('Карта скопирована. Выложи в сторис и отметь @tatakomotako ❤️');
 }catch(e){alert(text)}
}

document.getElementById('homeBtn').addEventListener('click',()=>show('warn'));
document.getElementById('readyBtn').addEventListener('click',proceedToDraw);
document.getElementById('drawBtn').addEventListener('click',drawCard);
document.getElementById('shareBtn').addEventListener('click',shareCard);
</script>
